[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_port = /dev/cu.usbserial-0001
upload_speed = 230400
board_build.partitions = min_spiffs.csv
lib_deps = 
	majicdesigns/MD_Parola@^3.7.5
	majicdesigns/MD_MAX72XX@^3.5.1
build_flags = 
	-DCORE_DEBUG_LEVEL=0

[env:d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 230400
board_build.partitions = min_spiffs.csv
lib_deps = 
	majicdesigns/MD_Parola@^3.7.5
	majicdesigns/MD_MAX72XX@^3.5.1
build_flags = 
	-DCORE_DEBUG_LEVEL=0

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_deps = 
	majicdesigns/MD_Parola@^3.7.5
	majicdesigns/MD_MAX72XX@^3.5.1
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
